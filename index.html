<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Energy Markets</title>

<style>
body{
    margin:0;
    background:#f4f6f9;
    font-family:Arial,sans-serif;
}

.header{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
    font-size:36px;
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    background:white;
    width:280px;
    border-radius:12px;
    padding:25px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    text-align:center;
}

.name{
    font-size:24px;
    font-weight:bold;
}

.price{
    font-size:42px;
    color:#003366;
    margin-top:15px;
}

.change{
    font-size:20px;
    margin-top:10px;
}

.positive{
    color:green;
}

.negative{
    color:red;
}

.updated{
    text-align:center;
    color:#666;
    padding-bottom:20px;
}
</style>
</head>
<body>

<div class="header">
    Live Energy Markets
</div>

<div class="container">
    <div class="card">
        <div class="name">WTI Crude</div>
        <div class="price" id="wti">$--</div>
        <div class="change" id="wti-change"></div>
    </div>

    <div class="card">
        <div class="name">Brent Crude</div>
        <div class="price" id="brent">$--</div>
        <div class="change" id="brent-change"></div>
    </div>

    <div class="card">
        <div class="name">Natural Gas</div>
        <div class="price" id="gas">$--</div>
        <div class="change" id="gas-change"></div>
    </div>
</div>

<div class="updated" id="updated">
Loading prices...
</div>

<script>

const API_KEY = "YOUR_API_KEY_HERE";

async function loadPrices() {

    try {

        const response = await fetch(
            "https://api.oilpriceapi.com/v1/prices/latest?by_code=WTI_USD,BRENT_USD,NATURAL_GAS_USD",
            {
                headers: {
                    "Authorization": `Token ${API_KEY}`
                }
            }
        );

        const result = await response.json();

        console.log(result);

        result.data.prices.forEach(item => {

            if(item.code.includes("WTI")){
                document.getElementById("wti").innerHTML =
                    "$" + item.price.toFixed(2);

                document.getElementById("wti-change").innerHTML =
                    item.change_percent.toFixed(2) + "%";
            }

            if(item.code.includes("BRENT")){
                document.getElementById("brent").innerHTML =
                    "$" + item.price.toFixed(2);

                document.getElementById("brent-change").innerHTML =
                    item.change_percent.toFixed(2) + "%";
            }

            if(item.code.includes("GAS")){
                document.getElementById("gas").innerHTML =
                    "$" + item.price.toFixed(2);

                document.getElementById("gas-change").innerHTML =
                    item.change_percent.toFixed(2) + "%";
            }
        });

        document.getElementById("updated").innerHTML =
            "Updated " + new Date().toLocaleString();

    }
    catch(error){

        console.error(error);

        document.getElementById("updated").innerHTML =
            "Unable to load prices. Check API key and browser console.";
    }
}

loadPrices();
setInterval(loadPrices,300000);

</script>

</body>
</html>
