<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Energy Prices</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.header {
    background: #003366;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 40px;
    font-weight: bold;
}

.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 40px;
    flex-wrap: wrap;
}

.card {
    background: white;
    width: 300px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    text-align: center;
}

.name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

.price {
    font-size: 48px;
    color: #003366;
}

.change {
    font-size: 22px;
    margin-top: 10px;
}

.positive { color: green; }
.negative { color: red; }

.updated {
    text-align: center;
    margin: 20px;
    color: #666;
}
</style>
</head>
<body>

<div class="header">
    Live Energy Markets
</div>

<div class="container">

    <div class="card">
        <div class="name">WTI Crude</div>
        <div class="price" id="wti">$--</div>
        <div class="change" id="wti-change"></div>
    </div>

    <div class="card">
        <div class="name">Brent Crude</div>
        <div class="price" id="brent">$--</div>
        <div class="change" id="brent-change"></div>
    </div>

    <div class="card">
        <div class="name">Natural Gas</div>
        <div class="price" id="gas">$--</div>
        <div class="change" id="gas-change"></div>
    </div>

</div>

<div class="updated" id="updated">
Loading...
</div>

<script>

const API_KEY = "PASTE_YOUR_API_KEY_HERE";

async function loadPrices() {

    try {

        const response = await fetch(
            "https://api.oilpriceapi.com/v1/prices/latest?by_code=WTI_USD,BRENT_USD,NATURAL_GAS_USD",
            {
                headers: {
                    "Authorization": `Token ${API_KEY}`
                }
            }
        );

        const result = await response.json();

        result.data.prices.forEach(item => {

            let target;

            if(item.code.includes("WTI"))
                target = "wti";

            if(item.code.includes("BRENT"))
                target = "brent";

            if(item.code.includes("GAS"))
                target = "gas";

            if(!target) return;

            document.getElementById(target).innerHTML =
                "$" + item.price.toFixed(2);

            document.getElementById(target + "-change").innerHTML =
                `${item.change >= 0 ? "+" : ""}${item.change_percent.toFixed(2)}%`;

            document.getElementById(target + "-change").className =
                "change " + (item.change >= 0 ? "positive" : "negative");
        });

        document.getElementById("updated").innerHTML =
            "Updated: " + new Date().toLocaleString();

    } catch(e) {

        document.getElementById("updated").innerHTML =
            "Unable to load prices";
    }
}

loadPrices();

setInterval(loadPrices, 300000);

</script>

</body>
</html>
