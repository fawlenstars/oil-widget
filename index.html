<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
}

.container{
    padding:20px;
}

.price-box{
    display:flex;
    gap:40px;
    justify-content:center;
    align-items:center;
}

.card{
    background:#111;
    border:2px solid #444;
    border-radius:12px;
    padding:20px 30px;
    text-align:center;
    min-width:250px;
}

.name{
    font-size:28px;
    font-weight:bold;
}

.price{
    font-size:48px;
    color:#00d26a;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
    <div class="price-box">

        <div class="card">
            <div class="name">WTI Crude</div>
            <div class="price" id="wti">$--.--</div>
        </div>

        <div class="card">
            <div class="name">Brent Crude</div>
            <div class="price" id="brent">$--.--</div>
        </div>

    </div>
</div>

<script>
async function loadPrices() {
    const response = await fetch('/api/prices');
    const data = await response.json();

    document.getElementById('wti').innerText =
        '$' + data.WTI_USD.toFixed(2);

    document.getElementById('brent').innerText =
        '$' + data.BRENT_USD.toFixed(2);
}

loadPrices();
setInterval(loadPrices, 300000);
</script>

</body>
</html>
