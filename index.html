<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.dashboard{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    height:100vh;
    padding:20px;
    box-sizing:border-box;
}

.card{
    background:#111;
    border:2px solid #333;
    border-radius:20px;
    padding:30px;
    width:300px;
    text-align:center;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

.price{
    font-size:64px;
    font-weight:bold;
    color:#00d26a;
}

.change{
    margin-top:10px;
    font-size:24px;
}

.updated{
    position:fixed;
    bottom:10px;
    right:20px;
    color:#999;
    font-size:14px;
}
</style>
</head>
<body>

<div class="dashboard">

    <div class="card">
        <div class="title">WTI Crude</div>
        <div class="price" id="wti">$--.--</div>
        <div class="change" id="wti-change"></div>
    </div>

    <div class="card">
        <div class="title">Brent Crude</div>
        <div class="price" id="brent">$--.--</div>
        <div class="change" id="brent-change"></div>
    </div>

    <div class="card">
        <div class="title">Gasoline</div>
        <div class="price" id="gasoline">$--.--</div>
        <div class="change" id="gasoline-change"></div>
    </div>

</div>

<div class="updated" id="updated"></div>

<script>
const API_KEY = 'YOUR_API_KEY';

async function loadPrices() {

    const response = await fetch(
        'https://api.oilpriceapi.com/v1/prices/latest?by_code=WTI_USD,BRENT_USD,GASOLINE_US',
        {
            headers: {
                'Authorization': `Token ${API_KEY}`
            }
        }
    );

    const result = await response.json();

    const prices = {};
    result.data.prices.forEach(p => prices[p.code] = p);

    document.getElementById('wti').textContent =
        '$' + prices.WTI_USD.price.toFixed(2);

    document.getElementById('brent').textContent =
        '$' + prices.BRENT_USD.price.toFixed(2);

    document.getElementById('gasoline').textContent =
        '$' + prices.GASOLINE_US.price.toFixed(2);

    document.getElementById('wti-change').textContent =
        `${prices.WTI_USD.change_percent.toFixed(2)}%`;

    document.getElementById('brent-change').textContent =
        `${prices.BRENT_USD.change_percent.toFixed(2)}%`;

    document.getElementById('gasoline-change').textContent =
        `${prices.GASOLINE_US.change_percent.toFixed(2)}%`;

    document.getElementById('updated').textContent =
        'Updated: ' + new Date().toLocaleTimeString();
}

loadPrices();
setInterval(loadPrices, 300000);
</script>

</body>
</html>
